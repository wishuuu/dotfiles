[main]
# Nord/Frost — kompaktowy launcher, spójny z Waybarem i panelem Nord.
font=JetBrainsMono Nerd Font:size=10
dpi-aware=no
terminal=ghostty -e
prompt="⌕  "
placeholder=Szukaj aplikacji…
icon-theme=Papirus-Dark
icons-enabled=yes
lines=8
width=44
horizontal-pad=14
vertical-pad=10
inner-pad=8
line-height=22
match-counter=yes
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=2e3440ff
text=d8dee9ff
prompt=88c0d0ff
placeholder=7b88a1ff
input=eceff4ff
match=88c0d0ff
selection=3b4252ff
selection-text=eceff4ff
selection-match=8fbcbbff
counter=7b88a1ff
border=5e81acff

[border]
width=1
radius=6
selection-radius=4
