general {
    hide_cursor = true
}
background {
    monitor =
    path = ~/.config/hypr/wallpapers/nord.png
    color = rgba(2e3440ff)
    blur_passes = 2
    blur_size = 4
}
label {
    monitor =
    text = $TIME
    color = rgba(eceff4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = Witaj, $USER
    color = rgba(88c0d0ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 46
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 6
    outer_color = rgba(5e81acff)
    inner_color = rgba(2e3440ee)
    font_color = rgba(eceff4ff)
    check_color = rgba(88c0d0ff)
    fail_color = rgba(bf616aff)
    placeholder_text = Hasło…
    fail_text = Spróbuj ponownie
    capslock_color = rgba(ebcb8bff)
}
