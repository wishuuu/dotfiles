# Plik przejściowy dla już uruchomionej sesji używającej starego parsera.
# WŁAŚCIWA konfiguracja: hyprland.lua + bindings.lua (Hyprland >= 0.55).
# Wyloguj się i zaloguj ponownie po przebudowie NixOS.
# Nie usuwaj tego pliku podczas starej sesji: Hyprland odtworzy pusty stub.
monitor = , preferred, auto, 1
bind = SUPER, Return, exec, ghostty
bind = SUPER, D, exec, fuzzel
bind = SUPER, C, killactive,
bind = SUPER, SPACE, exec, desktop-menu
bind = SUPER SHIFT, E, exec, desktop-menu --power
bind = , XF86PowerOff, exec, desktop-menu --power
