# Ten katalog jest dowiązany do ~/.config/hypr — edytuj bez przebudowy NixOS.
monitor = , preferred, auto, 1
$terminal = ghostty
$menu = fuzzel
$mod = SUPER
source = ~/.config/hypr/bindings.conf

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = /run/current-system/sw/libexec/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

input {
    kb_layout = pl
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(89b4fa)
    col.inactive_border = rgb(45475a)
    layout = dwindle
}
decoration {
    rounding = 8
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
}
